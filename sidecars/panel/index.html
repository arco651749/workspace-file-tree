<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Workspace File Tree</title>
  <link rel="stylesheet" href="/styles.css">
  <script src="/preload.js"></script>
</head>
<body>
  <div class="app-layout">
    <!-- Header -->
    <header class="panel-header">
      <div class="workspace-info" id="workspace-info-box" title="Click to change folder">
        <span class="folder-badge">📁</span>
        <div class="workspace-text-group">
          <span id="workspace-name" class="workspace-title">Loading...</span>
          <span id="workspace-path" class="workspace-subtitle"></span>
        </div>
      </div>
      <div class="header-actions">
        <button id="btn-change-path" class="icon-btn" title="Specify Custom Folder Path">📂</button>
        <button id="btn-refresh" class="icon-btn" title="Refresh Tree">🔄</button>
        <button id="btn-toggle-hidden" class="icon-btn" title="Toggle Hidden / Ignored Files">👁️</button>
      </div>
    </header>

    <!-- Path Input Overlay (Hidden by default) -->
    <div id="path-input-bar" class="path-input-bar" hidden>
      <input type="text" id="manual-path-input" placeholder="Enter absolute folder path (e.g. D:\MyProject)..." />
      <button id="btn-apply-path" class="btn btn-primary">Set</button>
      <button id="btn-cancel-path" class="icon-btn">✕</button>
    </div>

    <!-- Filter / Search Bar -->
    <div class="search-bar">
      <input type="text" id="search-input" placeholder="Quick filter by name (e.g. .ts, config)..." autocomplete="off" />
      <button id="btn-clear-search" class="clear-btn" hidden>×</button>
    </div>

    <!-- Tree View -->
    <main class="tree-viewport" id="tree-viewport">
      <div id="tree-container" class="tree-container">
        <div class="loading-state">Scanning workspace directory...</div>
      </div>
    </main>

    <!-- Resizer Splitter Bar -->
    <div id="preview-resizer" class="preview-resizer" hidden></div>

    <!-- File Preview Drawer -->
    <div id="preview-drawer" class="preview-drawer" hidden>
      <div class="drawer-header">
        <div class="drawer-title-group">
          <span id="preview-icon">📄</span>
          <span id="preview-title" class="drawer-title">File Preview</span>
          <span id="preview-size" class="drawer-size"></span>
        </div>
        <div class="drawer-actions">
          <div id="preview-custom-actions" class="preview-custom-actions"></div>
          <button id="btn-open-tab" class="icon-btn" title="在 Antigravity 主分頁開啟 (Open in Native Tab)">↗️</button>
          <button id="btn-send-agent" class="btn btn-primary" title="Ask Agent">💬 Ask</button>
          <button id="btn-close-preview" class="icon-btn">✕</button>
        </div>
      </div>
      <div class="drawer-body" id="preview-body">
        <!-- Preview strategies dynamically mount here -->
      </div>
      <!-- Floating Selection Quote Bubble -->
      <div id="selection-quote-bubble" class="selection-quote-bubble" hidden>
        <button id="btn-quote-copy" class="btn-bubble-action" title="複製引用文字，在對話輸入框按 Ctrl+V 貼上">
          <span>📋</span> Ctrl + C, V
        </button>
        <button id="btn-quote-send" class="btn-bubble-action btn-bubble-secondary" title="向 Agent 提問">
          <span>💬</span> Ask
        </button>
      </div>

      <!-- Direct Send Message Input Popover -->
      <div id="annot-send-popover" class="annot-send-popover" hidden>
        <div class="popover-header">
          <span class="popover-title">💬 附帶訊息發送給 Agent</span>
          <button class="icon-btn" id="btn-popover-close" title="關閉 (Esc)">✕</button>
        </div>
        <div class="popover-body">
          <textarea id="annot-prompt-input" rows="3" placeholder="請輸入想對 AI Agent 說的話（按 Enter 直接發送，Shift+Enter 換行）..."></textarea>
        </div>
        <div class="popover-footer">
          <span class="popover-hint">Enter 發送 · Esc 取消</span>
          <button class="btn btn-secondary" id="btn-popover-cancel">取消</button>
          <button class="btn btn-primary" id="btn-popover-submit">確認發送</button>
        </div>
      </div>
    </div>

    <!-- Custom Recycle Bin Confirmation Modal -->
    <div id="delete-confirm-modal" class="confirm-modal-overlay" hidden>
      <div class="confirm-modal-box">
        <div class="confirm-modal-header">
          <span class="confirm-modal-icon">🗑️</span>
          <span class="confirm-modal-title">移至系統資源回收桶</span>
        </div>
        <div class="confirm-modal-body">
          確定要將 <b id="delete-confirm-target" style="color:var(--text-primary); word-break:break-all;"></b> 移至資源回收桶嗎？
          <div style="font-size:11px; color:var(--text-muted); margin-top:8px; line-height:1.4;">
            💡 檔案不會被永久抹除，若誤刪隨時可至 Windows 桌面資源回收桶找回還原。
          </div>
        </div>
        <div class="confirm-modal-footer">
          <button id="btn-delete-cancel" class="btn btn-secondary">取消</button>
          <button id="btn-delete-confirm" class="btn btn-danger" style="background:#f38ba8; color:#11111b; font-weight:600; border:none; padding:5px 12px; border-radius:4px; cursor:pointer;">移至回收桶</button>
        </div>
      </div>
    </div>

    <!-- Toast Notification -->
    <div id="toast" class="toast" hidden></div>
  </div>

  <script src="/highlight.min.js"></script>
  <script src="/pdf.min.js"></script>
  <script src="/previewers.js"></script>
  <script src="/app.js"></script>
</body>
</html>
